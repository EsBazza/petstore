services:
  - type: web
    name: petstore-backend
    runtime: docker
    plan: free
    healthCheckPath: /alonzo/api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: petstore-postgres
          property: connectionString

  - type: static_site
    name: petstore-frontend
    buildCommand: "npm install && npm run build"
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://petstore-backend.onrender.com/alonzo/api

databases:
  - name: petstore-postgres
    plan: free
    databaseName: petstore_db
    user: petstore_user
