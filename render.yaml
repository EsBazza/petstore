services:
  # Backend Service
  - type: web
    name: petstore-backend
    runtime: docker
    plan: free
    healthCheckPath: /alonzo/api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: petstore-postgres
          property: connectionString

  # Frontend Service
  - type: web
    name: petstore-frontend
    runtime: static
    # REMOVED 'plan: free' - static sites are free by default in blueprints
    staticPublishPath: ./frontend/dist
    buildCommand: cd frontend && npm install && npm run build

databases:
  - name: petstore-postgres
    plan: free
    databaseName: petstore_db
    user: petstore_user
