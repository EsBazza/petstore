services:
  - type: web
    name: petstore-backend
    runtime: java
    plan: starter
    buildCommand: "cd backend && mvn clean package"
    startCommand: "java -jar backend/target/petstore-api-1.0.0.jar"
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: petstore-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: petstore-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: petstore-postgres
          property: password

  - type: web
    name: petstore-frontend
    runtime: static site
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://petstore-backend.onrender.com

  - type: pserv
    name: petstore-postgres
    plan: starter
    ipWhitelist: []
    envVars:
      - key: POSTGRES_DB
        value: petstore_db
      - key: POSTGRES_USER
        value: petstore_user
      - key: POSTGRES_PASSWORD
        generateValue: true
